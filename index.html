<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моё расписание</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 20px;
      min-height: 100vh;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #999999);
      margin-bottom: 24px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #999999);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-value {
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1 id="greeting">Привет!</h1>
  <p class="subtitle">Это твоё приложение для расписания смен</p>

  <div class="card">
    <div class="card-title">Следующая смена</div>
    <div class="card-value">— пока нет данных —</div>
  </div>

  <div class="card">
    <div class="card-title">Смен в этом месяце</div>
    <div class="card-value">0</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('greeting').textContent =
          'Привет, ' + (user.first_name || 'друг') + '!';
      }
    }
  </script>
</body>
</html>
