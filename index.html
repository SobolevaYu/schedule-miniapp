<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моё расписание</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 16px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 20px; }

    .email-form {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .email-form label { font-size: 13px; color: var(--tg-theme-hint-color, #999999); display: block; margin-bottom: 8px; }
    .email-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 10px;
    }
    .email-form button {
      width: 100%;
      padding: 12px;
      background: #32CD32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .email-form button:disabled { opacity: 0.5; }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .month-title { font-size: 18px; font-weight: 600; }
    .month-nav {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      color: var(--tg-theme-text-color, #000);
    }

    .calendar {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 12px;
      padding: 12px;
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .weekday {
      text-align: center;
      font-size: 11px;
      color: var(--tg-theme-hint-color, #999999);
      text-transform: uppercase;
      font-weight: 600;
      padding: 4px 0;
    }
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .day {
      aspect-ratio: 1;
      border-radius: 8px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 12px;
      position: relative;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .day-num { font-size: 12px; font-weight: 600; line-height: 1; }
    .day-time { font-size: 9px; line-height: 1.1; font-weight: 500; text-align: center; }
    .day-status { font-size: 14px; font-weight: 700; text-align: center; margin-top: 2px; }
    .day.other-month { opacity: 0.25; }
    .day.today { outline: 2px solid #32CD32; outline-offset: -2px; }

    .legend {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--tg-theme-hint-color, #999999);
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }

    .loading { color: var(--tg-theme-hint-color, #999999); font-size: 14px; text-align: center; padding: 20px; }
    .error { color: #d9534f; font-size: 14px; padding: 12px; }
  </style>
</head>
<body>
  <h1 id="greeting">Привет!</h1>
  <p class="subtitle">Твоё расписание смен</p>

  <!-- Форма ввода email -->
  <div class="email-form" id="emailForm" style="display:none">
    <label>Введи свой рабочий email, чтобы видеть свои смены:</label>
    <input type="email" id="emailInput" placeholder="ivan@example.com" />
    <button id="saveEmail">Сохранить</button>
  </div>

  <!-- Календарь -->
  <div id="calendarWrap" style="display:none">
    <div class="month-header">
      <button class="month-nav" id="prevMonth">←</button>
      <div class="month-title" id="monthTitle">Октябрь 2026</div>
      <button class="month-nav" id="nextMonth">→</button>
    </div>

    <div class="calendar">
      <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
      </div>
      <div class="days" id="days"></div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-color" style="background:#32CD32"></div>Смена</div>
      <div class="legend-item"><div class="legend-color" style="background:#C0C0C0"></div>Больничный</div>
      <div class="legend-item"><div class="legend-color" style="background:#B0E0E6"></div>Отпуск</div>
    </div>
  </div>

  <div class="loading" id="loading" style="display:none">Загружаем данные…</div>

  <script>
    const SHEET_ID = '1CpWhm4KHW3pKi5BbMRo7nzAqpCkkUtYe-qmHVIVX648';
    const SHEET_NAME = 'Смены';
    const STORAGE_KEY = 'user_email';

    const tg = window.Telegram?.WebApp;
    let userEmail = null;
    let currentMonth = new Date();
    let allShifts = [];

    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('greeting').textContent =
          'Привет, ' + (user.first_name || 'друг') + '!';
      }
    }

    // ---- Работа с email ----
    function getSavedEmail() {
      return localStorage.getItem(STORAGE_KEY);
    }

    function saveEmail(email) {
      localStorage.setItem(STORAGE_KEY, email);
    }

    function showEmailForm() {
      document.getElementById('emailForm').style.display = 'block';
      document.getElementById('calendarWrap').style.display = 'none';
      document.getElementById('saveEmail').addEventListener('click', () => {
        const val = document.getElementById('emailInput').value.trim().toLowerCase();
        if (!val || !val.includes('@')) {
          alert('Введи корректный email');
          return;
        }
        saveEmail(val);
        userEmail = val;
        initApp();
      });
    }

    // ---- Загрузка смен ----
    async function loadShifts() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const rows = json.table.rows || [];

      allShifts = rows
        .map(row => ({
          email: (row.c[0]?.v || '').toString().toLowerCase().trim(),
          date: row.c[1]?.f || '',
          start: row.c[2]?.f || '',
          end: row.c[3]?.f || '',
          status: (row.c[4]?.v || '').toString().trim().toUpperCase(),
        }))
        .filter(s => s.email);
    }

    // ---- Рендер календаря ----
    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();

      const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      document.getElementById('monthTitle').textContent = monthNames[month] + ' ' + year;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      // Понедельник = 0 в нашей сетке, JS воскресенье = 0. Меняем:
      let startWeekday = firstDay.getDay() - 1;
      if (startWeekday < 0) startWeekday = 6;

      const daysInMonth = lastDay.getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const cells = [];
      const today = new Date();
      const todayStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');

      // Дни прошлого месяца (для красоты)
      for (let i = startWeekday - 1; i >= 0; i--) {
        cells.push({ num: prevMonthLastDay - i, other: true, date: null });
      }

      // Дни этого месяца
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = year + '-' +
          String(month + 1).padStart(2, '0') + '-' +
          String(d).padStart(2, '0');
        cells.push({ num: d, other: false, date: dateStr, isToday: dateStr === todayStr });
      }

      // Дни следующего месяца — добить до кратного 7
      const remaining = (7 - (cells.length % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        cells.push({ num: i, other: true, date: null });
      }

      const container = document.getElementById('days');
      container.innerHTML = '';

      cells.forEach(cell => {
        const div = document.createElement('div');
        div.className = 'day' + (cell.other ? ' other-month' : '') + (cell.isToday ? ' today' : '');

        if (cell.date) {
          const shift = allShifts.find(s => s.email === userEmail && s.date === cell.date);
          if (shift) {
            if (shift.status === 'Б') {
              div.style.background = '#C0C0C0';
              div.innerHTML = `<div class="day-num">${cell.num}</div><div class="day-status">Б</div>`;
            } else if (shift.status === 'О') {
              div.style.background = '#B0E0E6';
              div.innerHTML = `<div class="day-num">${cell.num}</div><div class="day-status">О</div>`;
            } else if (shift.start && shift.end) {
              div.style.background = '#32CD32';
              div.style.color = 'white';
              div.innerHTML = `<div class="day-num">${cell.num}</div><div class="day-time">${shift.start}<br>${shift.end}</div>`;
            } else {
              div.style.background = '#FFFFFF';
              div.innerHTML = `<div class="day-num">${cell.num}</div>`;
            }
          } else {
            div.style.background = '#FFFFFF';
            div.innerHTML = `<div class="day-num">${cell.num}</div>`;
          }
        } else {
          div.style.background = 'transparent';
          div.innerHTML = `<div class="day-num">${cell.num}</div>`;
        }

        container.appendChild(div);
      });
    }

    // ---- Инициализация ----
    async function initApp() {
      document.getElementById('emailForm').style.display = 'none';
      document.getElementById('calendarWrap').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        await loadShifts();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('calendarWrap').style.display = 'block';
        renderCalendar();
      } catch (e) {
        document.getElementById('loading').innerHTML = '<div class="error">Ошибка: ' + e.message + '</div>';
      }
    }

    // ---- Кнопки переключения месяца ----
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth.setMonth(currentMonth.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth.setMonth(currentMonth.getMonth() + 1);
      renderCalendar();
    });

    // ---- Старт ----
    const saved = getSavedEmail();
    if (saved) {
      userEmail = saved;
      initApp();
    } else {
      showEmailForm();
    }
  </script>
</body>
</html>
